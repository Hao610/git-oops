[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-oops"
version = "1.0.0"
description = "The Dual-Mode Terminal Crash Fixer & Autonomous AI Agent Safety Harness (The Final Legend Edition)."
readme = "README.md"
authors = [{ name = "Hao" }]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "pytest>=7.0.0"
]

[project.scripts]
git-oops = "src.cli:main"
