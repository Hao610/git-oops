name: Sync Release Tag to Main

on:
  push:
    branches:
      - main

jobs:
  sync-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Dynamically Sync and Publish Current Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Automatically extract the latest version tag (e.g. v1.0.0, v0.2.0)
          # Fallback to v0.2.0 if no tags found
          TARGET_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG="v0.2.0"
          fi
          
          echo "Target Release Tag determined dynamically: $TARGET_TAG"
          
          # Force move the latest tag to current HEAD
          git tag -f "$TARGET_TAG"
          git push origin "$TARGET_TAG" --force

          # Check if Release exists; create or edit it dynamically
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Release $TARGET_TAG exists, updating target..."
            gh release edit "$TARGET_TAG" --target "$GITHUB_SHA" --notes-file .github/release_notes.md --draft=false
          else
            echo "Release $TARGET_TAG does not exist, creating dynamically..."
            gh release create "$TARGET_TAG" --title "⚡ git-oops $TARGET_TAG: The Eternal Edition" --notes-file .github/release_notes.md --target "$GITHUB_SHA" --draft=false
          fi
