name: Sync Release Tag to Main

on:
  push:
    branches:
      - main

jobs:
  sync-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest release tag and update GitHub Release target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Force move v0.2.0 tag to current HEAD
          git tag -f v0.2.0
          git push origin v0.2.0 --force

          # Automatically update the GitHub Release to point directly to the current HEAD
          gh release edit v0.2.0 --target "$GITHUB_SHA"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
