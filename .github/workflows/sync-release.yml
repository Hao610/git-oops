name: Sync Release Tag to Main

on:
  push:
    branches:
      - main

jobs:
  sync-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Dynamically Sync and Publish Current Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Extract authoritative project version directly from pyproject.toml
          PROJECT_VER=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ -n "$PROJECT_VER" ]; then
            TARGET_TAG="v$PROJECT_VER"
          else
            TARGET_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          fi
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG="v1.0.3"
          fi
          
          echo "Target Release Tag determined dynamically: $TARGET_TAG"
          
          # Force move the latest tag to current HEAD
          git tag -f "$TARGET_TAG"
          git push origin "$TARGET_TAG" --force

          # Check if Release exists; create or edit it dynamically
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Release $TARGET_TAG exists, updating target..."
            gh release edit "$TARGET_TAG" --target "$GITHUB_SHA" --notes-file .github/release_notes.md --draft=false
          else
            echo "Release $TARGET_TAG does not exist, creating dynamically..."
            gh release create "$TARGET_TAG" --title "⚡ git-oops $TARGET_TAG: The Final Legend Edition" --notes-file .github/release_notes.md --target "$GITHUB_SHA" --draft=false
          fi

      - name: Set up Python for PyPI Packaging
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and universal wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Attach Distribution Artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROJECT_VER=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          TARGET_TAG="v$PROJECT_VER"
          gh release upload "$TARGET_TAG" dist/* --clobber

      - name: Publish Official Package to PyPI via Trusted Publishing with Provenance
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
